// Contrato entre o cliente e os controladores (gRPC).
// Depois de alterar este arquivo, gere o código Python com:
//   python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. estufa.proto
syntax = "proto3";

// Serviço oferecido por cada controlador
service Controlador {
  // devolve as leituras e o estado dos atuadores de uma cultura
  rpc ObterStatus (StatusRequest) returns (StatusResponse);
  // liga/desliga um atuador manualmente, ou devolve para o automático
  rpc AcionarAtuador (AcaoRequest) returns (AcaoResponse);
}

message StatusRequest {
  string cultura = 1;               // "tomate", "alface" ou "morango"
}

message StatusResponse {
  string cultura = 1;
  map<string, double> leituras = 2;  // grandeza -> valor mais recente
  map<string, bool> atuadores = 3;   // atuador -> ligado?
  int32 controlador_id = 4;          // qual réplica respondeu
  bool lider = 5;                    // se essa réplica é a líder
}

message AcaoRequest {
  string cultura = 1;
  string atuador = 2;               // "irrigacao", "ventilacao", ...
  string modo = 3;                  // "ligar", "desligar" ou "auto"
}

message AcaoResponse {
  bool sucesso = 1;
  string mensagem = 2;
  int32 controlador_id = 3;
}